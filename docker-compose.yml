services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: medimplant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medimplant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medimplant}
      POSTGRES_DB: ${POSTGRES_DB:-medimplant}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - medimplant-pgdata:/var/lib/postgresql/data

  cms:
    image: directus/directus:11
    container_name: medimplant-directus
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      # Phase de test local de l'automatisation : pointe sur la base locale (service "db" du même
      # docker-compose), pas sur Supabase. Le Directus déployé sur Render, lui, garde sa propre
      # config pointée sur Supabase (définie directement dans son dashboard, pas ici) — inchangé.
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-medimplant}
      DB_USER: ${POSTGRES_USER:-medimplant}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-medimplant}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@medimplant.local}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-medimplant}
      # Autorise les Flows à rappeler l'API Directus elle-même (ex. opération "Webhook/Request URL"
      # vers localhost:8055) — bloqué par défaut par la protection anti-SSRF de Directus. Sans danger
      # ici : instance 100% locale, jamais exposée à l'extérieur.
      IMPORT_IP_DENY_LIST: ""
    volumes:
      - medimplant-directus-uploads:/directus/uploads

volumes:
  medimplant-pgdata:
  medimplant-directus-uploads:
