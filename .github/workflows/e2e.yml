name: Tests e2e (Selenium)

# Trois déclencheurs :
# - deployment_status : rejoue les tests juste après un déploiement Vercel réussi
#   (nécessite que l'app GitHub Vercel poste bien des deployment_status ; c'est le cas
#   par défaut pour les intégrations Vercel<->GitHub standard).
# - schedule : filet de sécurité quotidien, indépendant du bon déclenchement de Vercel.
# - workflow_dispatch : lancement manuel depuis l'onglet Actions.
on:
  deployment_status:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  e2e:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BASE_URL: ${{ github.event.deployment_status.target_url || 'https://empower-doctor.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Lancer les tests e2e
        run: npm run test:e2e
